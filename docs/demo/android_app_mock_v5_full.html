function mkCr(cx,cy,s,rot,col,dc,op){
const r=rot*Math.PI/180,co=Math.cos(r),si=Math.sin(r);

v+=`<polygon points="${p([[.35,-.05],[.58,.06],[.42,.14]])}" fill="${col}" opacity="${o3}"/>`;
return v;
}

const screens={
water(){const ml=Math.round(S.waterPct*900);return`<div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0"><div style="font-size:36px;font-weight:500;color:#2A5A80;line-height:1" class="wn">${ml}<span class="iu">ml</span></div><div style="font-size:12px;color:#5A8EB0">${Math.round(S.waterPct*100)}% of 900ml</div><div style="width:50px;height:10px;border-radius:4px 4px 0 0;background:rgba(42,90,128,.3);margin:0 auto"></div><div class="bw" id="btl"><div class="bwf" id="bwf" style="height:${S.waterPct*100}%"></div></div><div style="font-size:10px;color:#5A8EB0;opacity:.4">Drag to adjust</div></div><div class="ic"><div class="il">Today</div><div class="te"><div style="width:8px;height:8px;border-radius:50%;background:#85B7EB;margin-top:4px;flex-shrink:0"></div><div style="font-size:10px;color:#5A8EB0;width:40px">07:30</div><div style="font-size:11px;color:#2A5A80">+250 ml</div></div><div class="te"><div style="width:8px;height:8px;border-radius:50%;background:#85B7EB;margin-top:4px;flex-shrink:0"></div><div style="font-size:10px;color:#5A8EB0;width:40px">10:15</div><div style="font-size:11px;color:#2A5A80">+200 ml</div></div></div>`;},
food(){const ms=['Breakfast','Lunch','Dinner','Snacks'],ic=['\u2600','\u{1F324}','\u{1F319}','\u{1F36A}'],ds=['Oatmeal with berries','Chicken salad wrap','Tap to log','Tap to log'];return ms.map((m,i)=>{const l=S.meals[i];return`<div class="ms${l?' msl':''}" style="background:rgba(255,255,255,${l?.45:.3})" data-ml="${i}"><div style="font-size:16px;margin-bottom:2px">${ic[i]}</div><div style="font-size:12px;font-weight:500;color:#2A5A80">${m}</div><div style="font-size:10px;color:#5A8EB0;margin-top:2px">${l?ds[i]:'Tap to log'}</div></div>`;}).join('')+`<div class="ic"><div class="il">Summary</div><div style="font-size:12px;color:#2A5A80">${S.meals.filter(m=>m).length}/4 meals</div></div>`;},
bathroom(){return`<div class="ic"><div class="il">Quick log</div><div style="display:flex;gap:6px"><div style="font-size:11px;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.45);color:#2A5A80;cursor:pointer" id="addB">+ Log now</div></div></div><div class="ic"><div class="il">Today</div>${S.bathroomLog.map(b=>`<div class="te"><div style="width:8px;height:8px;border-radius:50%;background:#ED93B1;margin-top:4px;flex-shrink:0"></div><div style="font-size:10px;color:#5A8EB0;width:40px">${b.t}</div><div style="font-size:11px;color:#2A5A80">Break</div></div>`).join('')}</div>`;},
health(){return`<div class="ic"><div class="il">Energy level</div><div class="ib">${S.energy}<span class="iu">/ 10</span></div><div class="st" id="esl"><div class="sf" style="width:${S.energy*10}%;background:#5DCAA5"></div></div></div><div class="ic"><div class="il">Daily rating</div><div class="rd">${Array.from({length:10},(_,i)=>{const on=i+1<=S.rating;return`<div class="ri" style="background:${on?'rgba(93,202,165,.6)':'rgba(255,255,255,.35)'};color:${on?'#085041':'#5A8EB0'}" data-rt="${i+1}">${i+1}</div>`;}).join('')}</div></div><div class="ic"><div class="il">Symptoms</div><div style="display:flex;gap:6px;flex-wrap:wrap">${Object.entries(S.symptoms).map(([k,v])=>`<div class="sy" style="background:${v?'rgba(240,153,123,.5)':'rgba(255,255,255,.35)'};color:${v?'#712B13':'#5A8EB0'}" data-sy="${k}">${k}</div>`).join('')}</div></div>`;},
sleep(){return`<div class="ic" style="text-align:center"><div class="ib">7h 20m</div><div style="font-size:12px;color:#5A8EB0">Total sleep</div></div><div class="ic"><div class="il">Bedtime / Wake</div><div style="display:flex;align-items:center;gap:8px"><div style="background:rgba(255,255,255,.55);border-radius:10px;padding:6px 12px;font-size:16px;font-weight:500;color:#2A5A80;text-align:center">23:30</div><div style="font-size:14px;color:#5A8EB0">\u2192</div><div style="background:rgba(255,255,255,.55);border-radius:10px;padding:6px 12px;font-size:16px;font-weight:500;color:#2A5A80;text-align:center">06:50</div></div></div><div class="ic"><div class="il">Sleep quality</div><div class="wb"><div style="flex:3;background:rgba(174,169,236,.45)"></div><div style="flex:.3;background:rgba(240,153,123,.5)"></div><div style="flex:2.5;background:rgba(174,169,236,.45)"></div><div style="flex:.2;background:rgba(240,153,123,.5)"></div><div style="flex:1.5;background:rgba(174,169,236,.45)"></div></div><div style="display:flex;justify-content:space-between;font-size:10px;color:#5A8EB0"><span>23:30</span><span>2 wake-ups</span><span>06:50</span></div></div>`;},
emotions(){const md=[{f:'\u{1F60A}',l:'Happy',b:'#F5E5C4'},{f:'\u{1F60C}',l:'Calm',b:'#CCE8DD'},{f:'\u{1F614}',l:'Sad',b:'#D4E9F7'},{f:'\u{1F620}',l:'Angry',b:'#F5C4B3'},{f:'\u{1F630}',l:'Anxious',b:'#F5D6E3'},{f:'\u{1F634}',l:'Tired',b:'#DEDCF7'}];return`<div class="ic"><div class="il">How are you feeling?</div><div class="mg">${md.map((m,i)=>`<div style="text-align:center"><div class="mf${i===S.mood?' sel':''}" style="background:${m.b}" data-mo="${i}">${m.f}</div><div style="font-size:9px;color:#5A8EB0;margin-top:2px">${m.l}</div></div>`).join('')}</div></div><div class="ic"><div class="il">Note</div><textarea class="ta" style="background:rgba(240,223,184,.25);color:#2A5A80" placeholder="What's on your mind?">Feeling calm after morning walk</textarea></div>`;},
interactions(){return`<div class="ic"><div class="il">Who?</div><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tp">\u{1F464} Mom</span><span class="tp">\u{1F464} Alex</span><span class="tp" style="opacity:.5">+ Add</span></div></div><div class="ic"><div class="il">How did it go?</div><div class="rd">${[1,2,3,4,5].map(i=>`<div class="ri" style="background:${i<=4?'rgba(250,199,117,.6)':'rgba(255,255,255,.35)'};color:${i<=4?'#633806':'#5A8EB0'};width:28px;height:28px">\u2605</div>`).join('')}</div></div><div class="ic"><div class="il">Journal</div><textarea class="ta" style="min-height:90px;background:rgba(237,208,194,.2);color:#2A5A80" placeholder="Write about your day...">Had a great call with Mom. Then coffee with Alex.</textarea></div>`;},
chores(){const ch=['Dishes','Vacuum','Laundry','Groceries','Clean bath','Cook dinner','Trash'],tm=[8,12,15,25,18,30,5];let dn=S.chores.filter(c=>c).length;return`<div class="ic"><div class="il">Progress</div><div class="ib">${dn}<span class="iu">/ ${ch.length}</span></div><div class="st"><div class="sf" style="width:${dn/ch.length*100}%;background:#5DCAA5"></div></div></div><div class="ic"><div class="il">Tasks</div>${ch.map((c,i)=>{const d=S.chores[i];return`<div class="ci"><div class="ck${d?' dn':''}" data-ch="${i}">${d?'\u2713':''}</div><div style="font-size:12px;color:#2A5A80;${d?'text-decoration:line-through;opacity:.5':''}">${c}</div>${d?`<div style="font-size:10px;color:#5A8EB0;margin-left:auto">${tm[i]}m</div>`:''}</div>`;}).join('')}</div>`;},
hobbies(){const tot=S.hobs.reduce((a,h)=>a+h.min,0),cn=Math.floor(tot/5);return`<div class="ic"><div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px"><div style="font-size:28px;font-weight:500;color:#2A5A80;line-height:1">${tot}<span style="font-size:13px;color:#8A3050;margin-left:3px">min</span></div><div style="font-size:11px;color:#8A3050">${cn} cranes</div></div><div style="display:flex;justify-content:center"><svg id="crSvg" viewBox="-10 -30 320 300" width="100%" style="max-width:300px;overflow:visible" xmlns="http://www.w3.org/2000/svg"></svg></div><div style="text-align:center;font-size:9px;color:#8A3050;opacity:.4;margin-top:2px">1 crane = 5 min</div><div style="display:flex;gap:10px;justify-content:center;margin-top:6px;font-size:10px;color:#8A3050"><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#AFA9EC;vertical-align:middle;margin-right:3px"></span>Reading</span><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#F0997B;vertical-align:middle;margin-right:3px"></span>Guitar</span><span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#9FE1CB;vertical-align:middle;margin-right:3px"></span>Sketching</span></div></div><div class="ic"><div class="il">Add 5 min</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="hab" style="background:rgba(175,169,236,.35);color:#3C3489" data-hb="0">+ Reading</button><button class="hab" style="background:rgba(240,153,123,.35);color:#712B13" data-hb="1">+ Guitar</button><button class="hab" style="background:rgba(159,225,203,.35);color:#085041" data-hb="2">+ Sketching</button></div></div><div class="ic"><div class="il">Activities</div>${S.hobs.map((h,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.25)"><div style="width:8px;height:8px;border-radius:50%;background:${h.c};flex-shrink:0"></div><div style="font-size:12px;color:#2A5A80;flex:1">${h.n}</div><div style="font-size:10px;color:#8A3050" id="ht${i}">${h.min} min</div></div>`).join('')}</div>`;}
};

function R(){
const sc=document.getElementById('sc'),nv=document.getElementById('nv'),sb=document.getElementById('sb');
if(cur===-1){
sc.style.background='#C8DDF0';sb.style.color='#3A6D90';
sc.innerHTML=`<div class="bl">${BG('home')}</div><div class="ct"><div class="dh">Good morning</div><div class="dd">Tuesday, April 1</div><div class="dg">${CC.map((c,i)=>`<div class="dc" style="background:${c.bg}" data-g="${i}"><div style="font-size:20px;margin-bottom:4px">${c.icon}</div><div style="font-size:11px;font-weight:500;color:${c.fg}">${c.name}</div><div style="font-size:10px;opacity:.7;color:${c.fg};margin-top:3px">${c.val}</div></div>`).join('')}</div></div>`;
nv.innerHTML=`<div class="nh a" style="background:#3A6D90"></div>`+CC.map((_,i)=>`<div class="nd" style="background:rgba(58,109,144,.25)" data-g="${i}"></div>`).join('');
}else{
const c=CC[cur];sc.style.background=c.sbg;sb.style.color=c.sfg;
sc.innerHTML=`<div class="bl">${BG(c.id)}</div><div class="ct"><div class="hd"><div class="bk" data-g="-1">\u2190</div><div class="dt">${c.icon} ${c.name}</div></div><div class="db">${screens[c.id]()}</div></div>`;
nv.innerHTML=`<div class="nh" style="background:rgba(58,109,144,.35)" data-g="-1"></div>`+CC.map((_,i)=>`<div class="nd${i===cur?' a':''}" style="background:${i===cur?c.sfg:'rgba(58,109,144,.25)'}" data-g="${i}"></div>`).join('');
postBind(c.id);
}
sc.scrollTop=0;
document.querySelectorAll('[data-g]').forEach(el=>{el.style.cursor='pointer';el.onclick=e=>{e.stopPropagation();cur=parseInt(el.dataset.g);R();};});
}

function postBind(id){
if(id==='water'){
const b=document.getElementById('btl');if(!b)return;
b.onpointerdown=e=>{e.preventDefault();e.stopPropagation();b.setPointerCapture(e.pointerId);b._d=true;b._sy=e.clientY;b._sf=S.waterPct;};
b.onpointermove=e=>{if(!b._d)return;e.preventDefault();S.waterPct=Math.max(0,Math.min(1,b._sf+(b._sy-e.clientY)/200));const w=document.getElementById('bwf');if(w)w.style.height=S.waterPct*100+'%';const n=document.querySelector('.wn');if(n)n.innerHTML=Math.round(S.waterPct*900)+'<span class="iu">ml</span>';};
b.onpointerup=()=>{if(b._d){b._d=false;R();}};
}
if(id==='hobbies'){drawBowl(false);}
const esl=document.getElementById('esl');if(esl)esl.onclick=e=>{e.stopPropagation();const r=esl.getBoundingClientRect();S.energy=Math.round(Math.max(1,Math.min(10,((e.clientX-r.left)/r.width)*10)));R();};
document.querySelectorAll('[data-ml]').forEach(el=>el.onclick=e=>{e.stopPropagation();S.meals[+el.dataset.ml]^=1;R();});
document.querySelectorAll('[data-ch]').forEach(el=>el.onclick=e=>{e.stopPropagation();S.chores[+el.dataset.ch]^=1;R();});
document.querySelectorAll('[data-mo]').forEach(el=>el.onclick=e=>{e.stopPropagation();S.mood=+el.dataset.mo;R();});
document.querySelectorAll('[data-rt]').forEach(el=>el.onclick=e=>{e.stopPropagation();S.rating=+el.dataset.rt;R();});
document.querySelectorAll('[data-sy]').forEach(el=>el.onclick=e=>{e.stopPropagation();S.symptoms[el.dataset.sy]^=1;R();});
document.querySelectorAll('[data-hb]').forEach(el=>el.onclick=e=>{
e.stopPropagation();if(craneBusy)return;craneBusy=true;
const i=+el.dataset.hb;S.hobs[i].min+=5;
const tot=S.hobs.reduce((a,h)=>a+h.min,0),cn=Math.floor(tot/5);
document.querySelector('.ib')&&(document.querySelector('[id=bc]')||{}).innerHTML;
S.hobs.forEach((h,j)=>{const el2=document.getElementById('ht'+j);if(el2)el2.textContent=h.min+' min';});
drawBowl(true);
craneAnim(S.hobs[i].c,S.hobs[i].d,()=>{craneBusy=false;drawBowl(false);
const tot2=S.hobs.reduce((a,h)=>a+h.min,0);
CC[8].val=tot2+' min';
});
});
const ab=document.getElementById('addB');if(ab)ab.onclick=e=>{e.stopPropagation();const d=new Date();S.bathroomLog.push({t:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')});R();};
}

let px=0,py=0,sw=false,mv=false;
const ph=document.getElementById('ph');
ph.addEventListener('pointerdown',e=>{if(e.target.closest('.bw')||e.target.closest('textarea')||e.target.closest('.nv'))return;px=e.clientX;py=e.clientY;sw=true;mv=false;});
ph.addEventListener('pointermove',e=>{if(!sw)return;if(Math.abs(e.clientX-px)>8)mv=true;});
ph.addEventListener('pointerup',e=>{if(!sw)return;sw=false;if(!mv)return;const dx=e.clientX-px;if(Math.abs(dx)<45)return;if(dx<0){if(cur===-1)cur=0;else if(cur<CC.length-1)cur++;}else{if(cur===0)cur=-1;else if(cur>0)cur--;}R();});

R();
</script>
