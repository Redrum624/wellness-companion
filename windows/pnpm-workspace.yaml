# pnpm 10+ refuses to run dependency build scripts unless they are approved here.
# These are approved deliberately:
#
#   better-sqlite3-multiple-ciphers
#                   - compiles the native SQLite binding (SQLCipher-capable fork)
#                     the app stores entries in, encrypted at rest
#   node-llama-cpp  - fetches/builds the llama.cpp binaries that run the local model
#   esbuild         - downloads its platform binary
#   electron        - kept for older Electron lines only. Electron 43 ships NO
#                     postinstall script: `require('electron')` downloads the
#                     binary on first use instead (see its index.js), and
#                     electron-builder fetches its own copy when packaging. The
#                     entry is a harmless no-op today.
#
# These were previously left at pnpm's placeholder text ("set this to true or
# false"), which is not a boolean — so the build scripts were skipped and a fresh
# install produced an app with no native bindings.
allowBuilds:
  better-sqlite3-multiple-ciphers: true
  electron: true
  esbuild: true
  node-llama-cpp: true

# Install a flat (npm-style) node_modules tree instead of pnpm's symlinked
# virtual store. Required for packaging, not a preference:
#
# electron-builder 26 chooses how to walk node_modules by *detecting* the package
# manager, and that detection is not deterministic on Windows. It reads the
# `packageManager` field first (-> pnpm, correct), then probes for a workspace
# root with `pnpm --workspace-root exec pwd`. Under cmd/PowerShell `pwd` is not a
# command, the probe fails, and the correct answer survives. Under any POSIX
# shell (Git Bash / MSYS) `pwd` is a builtin, the probe succeeds and returns an
# MSYS path (`/c/...`); electron-builder takes that as the workspace root, finds
# no package.json there, and falls back to guessing from npm_config_user_agent —
# which says "npm" when the build was launched through `npx`.
#
# The casualty is node-llama-cpp: its llama.cpp backends ship as separate
# `@node-llama-cpp/<platform>` packages that sit beside it inside `.pnpm/`. A
# walk with npm's flat-layout assumptions never reaches them, they are dropped
# from the production dependency graph, and the packaged app keeps only
# `bins/*.moved.txt` placeholders — local AI generation cannot work and the
# installer comes out ~175 MB short.
#
# A hoisted tree is the layout every collector understands, so the packaged app
# no longer depends on which shell started the build.
#
# (This lives here rather than in .npmrc because pnpm 11 no longer reads
# node-linker from .npmrc.)
nodeLinker: hoisted
