<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Wellness Companion</title>
    <!-- Everything the renderer needs is bundled locally: no remote origin is
         reachable, no inline script is allowed, and connect-src is closed so a
         compromised renderer cannot exfiltrate entries. Nunito is vendored in
         styles/global.css rather than fetched from Google. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               font-src 'self' data:;
               img-src 'self' data: blob:;
               connect-src 'self';
               object-src 'none';
               frame-src 'none';
               base-uri 'none';
               form-action 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
